# Local demo stack: a QuickPizza app to test, Prometheus to store the k6 metrics, Grafana to show them.
# Every port is published on 127.0.0.1 only. Grafana has no login: do not expose it.
services:
  quickpizza:
    image: ghcr.io/grafana/quickpizza-local@sha256:29dbf276f9d7f82a20c250f8bfcf6e482491118c8a8a6db7cc6fe163e59a9b79
    ports:
      - "127.0.0.1:3333:3333"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
